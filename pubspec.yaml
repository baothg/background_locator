name: background_locator
description: A Flutter plugin to request the location even if the app is killed. Sending the location to a dart function in background, also provide a meter filter
version: 1.0.0
publish_to: 'none'
repository: https://github.com/baothg/background_locator
issue_tracker: https://github.com/baothg/background_locator/issues
platforms:
  android:
  ios:


environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=1.12.0"
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.thgbao.background_locator
        pluginClass: BackgroundLocatorPlugin
      ios:
        pluginClass: BackgroundLocatorPlugin
